; PHP Performance Optimizations

; OPcache Settings (already enabled, but optimize further)
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=60
opcache.fast_shutdown=1
opcache.enable_file_override=1

; Realpath Cache (increase size and TTL)
realpath_cache_size=8M
realpath_cache_ttl=600

; Session Performance (use APCu if available, else file-based)
session.save_handler=files
session.save_path=/data/sessions
session.gc_probability=0
session.lazy_write=1
