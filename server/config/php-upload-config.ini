; PHP Configuration for Large File Uploads (up to 20GB)
; 
; IMPORTANT: Apply these settings to handle large file uploads
; 
; For Development (XAMPP, WAMP, local PHP):
; - Edit php.ini file
; - Restart web server after changes
;
; For Production (Apache/Nginx):
; - May need to configure in php.ini, .htaccess, or server config
; - Also check web server limits (Apache's LimitRequestBody, Nginx's client_max_body_size)

[PHP Configuration]

; Maximum file size that can be uploaded
upload_max_filesize = 30G

; Maximum size of POST data (should be larger than upload_max_filesize)
post_max_size = 31G

; Maximum memory limit (not all file content loads into memory, but some overhead needed)
; For 20GB uploads, 512M-1G is sufficient as we use streaming
memory_limit = 10G

; Maximum execution time in seconds (1 hour = 3600s)
; Large files over slow connections may need longer
max_execution_time = 3600

; Maximum time to process POST data
max_input_time = 3600

; Enable file uploads
file_uploads = On

[Web Server Configuration]

; Apache (.htaccess or httpd.conf):
; LimitRequestBody 21474836480

; Nginx (nginx.conf or site config):
; client_max_body_size 20G;
; client_body_timeout 3600s;
; client_header_timeout 3600s;

[Important Notes]

1. Restart web server after php.ini changes
2. Check actual limits: Create info.php with <?php phpinfo(); ?> and check upload_max_filesize
3. Disk space: Ensure sufficient space in upload directory
4. Temp directory: Ensure /tmp or Windows temp has 20GB+ free space
5. For Nginx, also set: fastcgi_read_timeout, proxy_read_timeout
6. Consider implementing chunked uploads for better reliability with very large files
