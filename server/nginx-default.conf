# Server container: nginx + PHP-FPM (Slim front-controller)
# Replaces Apache; document root = /var/www/html/public

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32212254720;

    # Block execution of scripts in uploads and tus data (mirrors .htaccess RedirectMatch 403)
    location ~* ^/uploads/.*\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
    }
    location ~* ^/data/.*\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
    }

    # Front-controller: try file/dir, then pass to index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        # Don't buffer so X-Accel-Redirect from PHP is processed and nginx serves the file internally
        fastcgi_buffering off;
    }

    # Internal: app uploads (X-Accel-Redirect from PHP) – after main locations so routing is unchanged
    location /internal_uploads/ {
        internal;
        alias /var/www/html/uploads/;
        sendfile_max_chunk 2048m;
    }
    # Internal: WP uploads per domain (generated from wp-domains.json at container start)
    # Include from app dir so conf.d/*.conf does not load this at http level (location only valid in server)
    include /var/www/html/nginx-internal-wp.conf;
}
