# SSL reverse proxy: terminates HTTPS and proxies to client (Vue) and server (API)
# Certificates: mount ./ssl (or /etc/letsencrypt) at /etc/nginx/ssl
# Resolver + variables in proxy_pass defer DNS to request time (avoids "host not found" at startup)
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost;

    # Let's Encrypt ACME challenge (certbot renew --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Match your public domain so requests to https://updl.top-gsm.ir are proxied correctly
server {
    listen 443 ssl default_server;
    server_name localhost updl.top-gsm.ir;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # API backend (Slim/PHP) – /api/* is forwarded to server as /*
    # rewrite needed: proxy_pass with variable does not do URI replacement (passes / only)
    location /api/ {
        set $api_backend server:80;
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend static assets – pass full URI to client so JS/CSS are served, not index.html
    location ^~ /assets/ {
        set $frontend_backend client:80;
        proxy_pass http://$frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vue app) – everything else (SPA routes)
    location / {
        set $frontend_backend client:80;
        proxy_pass http://$frontend_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
