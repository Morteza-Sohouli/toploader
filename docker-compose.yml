services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN}
      SSL_EMAIL: ${SSL_EMAIL}
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl
      - letsencrypt_data:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    depends_on:
      - client
      - server
    restart: unless-stopped

  # Optional one-off if you prefer to get cert before starting proxy (e.g. proxy not yet built):
  #   docker compose stop proxy && docker compose --profile ssl-init run --rm -p 80:80 certbot-init && docker compose up -d
  certbot-init:
    image: certbot/certbot
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN}
      SSL_EMAIL: ${SSL_EMAIL}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - ./ssl:/ssl
    command: >
      sh -c "certbot certonly --standalone -d $$SSL_DOMAIN --email $$SSL_EMAIL
      --agree-tos --non-interactive
      && cp /etc/letsencrypt/live/$$SSL_DOMAIN/fullchain.pem /ssl/cert.pem
      && cp /etc/letsencrypt/live/$$SSL_DOMAIN/privkey.pem /ssl/key.pem"
    profiles:
      - ssl-init

  # Runs daily at 03:00 to renew cert and reload nginx (cron in container)
  certbot-renew:
    build:
      context: ./proxy
      dockerfile: Dockerfile.renew
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      - ./ssl:/ssl
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - proxy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_URL: ${UPLOAD_URL}
      WP_UPLOADS_PATH: ${WP_UPLOADS_PATH}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
    volumes:
      - ./server:/var/www/html
      # WordPress uploads: use named volume or bind-mount your existing folder, e.g. ./wp-content/uploads:/var/www/wp-content/uploads
      - ${WP_UPLOADS_PATH}:/var/www/wp-content/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  letsencrypt_data:
  acme_webroot:
