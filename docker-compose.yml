services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSL_DOMAINS: ${SSL_DOMAINS}
      SSL_EMAIL: ${SSL_EMAIL}
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl
      - letsencrypt_data:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    depends_on:
      - client
      - server
      - tusd
    restart: unless-stopped

  # Optional one-off if you prefer to get cert before starting proxy (e.g. proxy not yet built):
  #   docker compose stop proxy && docker compose --profile ssl-init run --rm -p 80:80 certbot-init && docker compose up -d
  certbot-init:
    image: certbot/certbot
    environment:
      SSL_DOMAINS: ${SSL_DOMAINS}
      SSL_EMAIL: ${SSL_EMAIL}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - ./ssl:/ssl
    command: >
      sh -c "DOMAIN_FLAGS=''; OLD_IFS=\"$$IFS\"; IFS=','; for d in $$SSL_DOMAINS; do DOMAIN_FLAGS=\"$$DOMAIN_FLAGS -d $$d\"; done; IFS=\"$$OLD_IFS\";
      certbot certonly --standalone $$DOMAIN_FLAGS --email $$SSL_EMAIL
      --agree-tos --non-interactive --expand
      && FIRST_DOMAIN=$$(echo $$SSL_DOMAINS | cut -d',' -f1)
      && cp /etc/letsencrypt/live/$$FIRST_DOMAIN/fullchain.pem /ssl/cert.pem
      && cp /etc/letsencrypt/live/$$FIRST_DOMAIN/privkey.pem /ssl/key.pem"
    profiles:
      - ssl-init

  # Runs daily at 03:00 to renew cert and reload nginx (cron in container)
  certbot-renew:
    build:
      context: ./proxy
      dockerfile: Dockerfile.renew
    environment:
      SSL_DOMAINS: ${SSL_DOMAINS}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      - ./ssl:/ssl
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - proxy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  tusd:
    image: tusproject/tusd:latest
    user: "33:33"
    command:
      - -behind-proxy
      - -base-path=/tus/
      - -upload-dir=/data/tus-data
      - -hooks-http=http://server:80/tus/hooks
      - -hooks-http-forward-headers=Cookie
      - -hooks-enabled-events=pre-create,post-finish
      - -max-size= ${MAX_FILE_SIZE}
    volumes:
      - ./data:/data
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_URL: ${UPLOAD_URL}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      SECURE_LINK_SECRET: ${SECURE_LINK_SECRET}
    volumes:
      - ./server:/var/www/html
      - ./data:/data
      # Domain-to-path config (read by PHP to resolve Host → uploads dir)
      - ./config/wp-domains.json:/var/www/config/wp-domains.json:ro
      # WordPress uploads: one bind-mount per domain (paths from .env, targets match config/wp-domains.json)
      - ${WP_UPLOADS_PATH_1}:/var/www/wp-uploads/domain1
      - ${WP_UPLOADS_PATH_2}:/var/www/wp-uploads/domain2
      - ${WP_UPLOADS_PATH_3}:/var/www/wp-uploads/domain3
      - ${WP_UPLOADS_PATH_4}:/var/www/wp-uploads/domain4
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  letsencrypt_data:
  acme_webroot:
